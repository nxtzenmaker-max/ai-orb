<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#08080a" />
  <circle cx="50" cy="50" r="40" fill="url(#orbGlow)" filter="url(#bloom)" />
  <circle cx="50" cy="50" r="16" fill="#ffffff" opacity="0.9" filter="url(#bloom)" />
</svg>
